#
# Application-specific PlatformIO configuration for MMC Local-Rank Neighbor Control.
# This file is included by the top-level platformio.ini.
#

[env:USB]
platform = ststm32
framework = zephyr
upload_protocol = dfu
build_src_filter =
    +<main.cpp>

[env:STLink]
platform = ststm32
framework = zephyr
upload_protocol = stlink
debug_tool = stlink
build_src_filter =
    +<main.cpp>

[env:native]
platform = native
build_flags =
    -std=c++20
    -Wall
    -Wextra
    -DMMC_HOST_BUILD=1
build_src_filter =
    +<main.cpp>
