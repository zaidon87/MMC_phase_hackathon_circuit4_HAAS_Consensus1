; PlatformIO placeholder for future embedded experiments.
; Update the board/platform after selecting the exact OwnTech/Twist target.

[platformio]
default_envs = native

[env:native]
platform = native
build_flags =
    -std=c11
    -Wall
    -Wextra
    -I src/embedded/include
src_filter =
    +<src/embedded/src/*.c>
