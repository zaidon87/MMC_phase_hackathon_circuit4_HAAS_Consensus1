#
# Project Configuration File
#
# OwnTech / MMC Local-Rank Neighbor Control
# PlatformIO configuration inspired by the OwnTech Power API workflow.
#
# Detailed PlatformIO documentation:
# https://docs.platformio.org/en/latest/projectconf/index.html
#

# Do not edit or remove the following line
[platformio]

# The following selects the default environment used by VS Code build/upload buttons.
# Available environments:
# - USB    -- upload to the board using USB serial
# - STLink -- upload using ST-Link and allow debug-oriented workflows
# - native -- compile host-side helper code only, when supported

default_envs = USB

# Do not edit or remove the following line
extra_configs =
    owntech/pio_extra.ini
    src/app.ini

lib_dir = owntech/lib
libdeps_dir = owntech/lib

# Do not edit or remove the following line
[env]

# |-----------------------------------------------------|
# |     Supported Board Options                         |
# |-----------------------------------------------------|
# | Board Name      | Board Versions                    |
# |-----------------|-----------------------------------|
# | spin            | 1_0_0, 1_1_0, 1_2_0               |
# |-----------------------------------------------------|
# |     Supported Shield Options                        |
# |-----------------------------------------------------|
# | Shield Name     | Shield Versions                   |
# |-----------------|-----------------------------------|
# | twist           | 1_2_0, 1_3_0, 1_4_0, 1_4_1, 1_4_2 |
# | ownverter       | 0_9_0, 1_0_0, 1_1_0               |
# |-----------------------------------------------------|

# Selected board and version
board = spin
board_version = 1_2_0

# Selected shield and version
board_shield = twist
board_shield_version = 1_4_2

# Compiler settings
build_flags =
    -std=c++2a
    -fsingle-precision-constant
    -DMMC_LOCAL_RANK_CONTROL=1

# Serial monitor baud rate
monitor_speed = 115200

# PlatformIO libraries. Keep one library per line with four spaces indentation.
lib_deps =
    control_library = https://github.com/owntech-foundation/control_library.git
    scope = https://github.com/owntech-foundation/scopemimicry.git
